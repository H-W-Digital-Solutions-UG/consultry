<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultry · scene poster studio</title>
  <style>
    body { margin: 24px; background: #151413; color: #f6f2ed; font: 16px system-ui; }
    header { display: flex; gap: 18px; align-items: center; }
    select, input, button { font: inherit; }
    #scene { width: 720px; height: 720px; }
    .outputs { display: flex; gap: 24px; align-items: start; }
    #poster { width: 240px; height: 240px; }
    canvas { display: block; }
  </style>
  <header>
    <h1>Scene poster studio</h1>
    <label>Object <select id="variant"></select></label>
    <label>Pose <input id="pose" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <output id="status">Preparing</output>
  </header>
  <p>Uses the production renderer, camera and rest pose. Transparent PNG is captured synchronously after its confirmed draw.</p>
  <div class="outputs"><div id="scene"></div><div><img id="poster" alt="Matching rest-pose export" /><p><a id="download">Download PNG</a></p></div></div>
  <script type="module" src="./scene-studio.ts"></script>
</html>
