schema_version: 1
baseline_id: "consultry-product-definition-working-2026-08-06"
baseline_status: "working_not_fully_ratified"
root: "product-definition/latest"

conflict_policy:
  - "A closed Wayfinder decision is authoritative for the question it explicitly resolves."
  - "_CONTEXT-AND-MEMORY.md must mirror ratified decisions and is the cold-start anchor."
  - "Product Vision governs the whole-product destination where no later decision supersedes it."
  - "Active candidates, evidence and technical handoff artifacts never silently override canon."
  - "Archive material is historical provenance only."

artifacts:
  current_canon:
    - path: "_CONTEXT-AND-MEMORY.md"
      role: "persistent context, ratified-decision summary and current frontier"
      caveat: "contains legacy sections that must be read under the conflict policy"
    - path: "CONTEXT.md"
      role: "canonical product and business-domain ubiquitous language"
      caveat: "contains only terms already ratified in Wayfinder; ticket records hold rationale and decision detail"
    - path: "Consultry-Whole-Consultancy-Coverage-Ledger-v0.1.md"
      role: "ratified whole-consultancy business coverage ledger"
      caveat: "coverage completeness is not Product-effect, priority or willingness-to-pay validation"
    - path: "Consultry-Canonical-User-Journey-Portfolio-v0.1.md"
      role: "ratified 6 + 1 journey portfolio and specification-depth routing"
      caveat: "Reference-now, Canonical-later and Horizon-contract depths do not redefine Whole-Product scope"
    - path: "Consultry-Opportunity-to-Project-Representative-Business-Thread-v0.1.md"
      role: "ratified Opportunity-to-Project Reference Thread across ERP Follow-on and net-new Tender entries"
      caveat: "representative scenario and Product-contract input; not a universal funnel, final lifecycle canon or technical workflow"
    - path: "Consultry-Active-Project-Delivery-Blind-Spot-Reference-Thread-v0.1.md"
      role: "ratified semantic Active Project/Delivery Blind-Spot and Rebuttal-Simulation Reference Thread"
      caveat: "representative scenario and potential PoC input; flow/UX details remain hypotheses and the thread does not choose the first PoC or define Whole-Product value"
    - path: "Consultry-Knowledge-Reuse-and-Corporate-Artifact-Alignment-Reference-Thread-v0.1.md"
      role: "ratified Knowledge/Reuse and Corporate Artifact Alignment Reference Thread"
      caveat: "representative artifact-revision scenario and cross-cutting Product-contract input; exact flow, result taxonomy, effect mechanism and full Corpus/Reuse journeys remain downstream"
    - path: "Consultry-Systemic-Platform-Click-Dummy-Experience-Contract-v0.1.md"
      role: "ratified prototype-direction contract for the systemic Click Dummy"
      caveat: "ratifies thin platform breadth, deep anchor journeys, progressive disclosure and agent-native co-work as prototype hypotheses; not final IA, UX validation or technical architecture"
    - path: "Consultry-Product-Vision-v1.0.md"
      role: "whole-product destination and module horizon"
      caveat: "valid only where not superseded by later closed Wayfinder decisions"
    - path: "wayfinder/"
      role: "product and business-domain decision system"
      caveat: "closed tickets are decision records; open tickets are unresolved work"

  active_candidate_or_input:
    - path: "Consultry-Alignment-Control-Plane-v1.0.md"
      role: "operating loops, terminology and governance candidate"
    - path: "Consultry-Business-Domain-Definition-v1.0.md"
      role: "domain-language and invariant input pending full reconciliation"
    - path: "Consultry-GTM-Decisions-v1.0.md"
      role: "GTM and positioning input"
    - path: "Consultry-Idea-Presentation-Baseline-v1.0.md"
      role: "pitch and narrative alignment input"
    - path: "Consultry-MVP-Measurement-Spec-v1.0.md"
      role: "proof and measurement input pending outcome-contract reconciliation"
    - path: "Consultry-Onboarding-Corpus-Ritual-v1.0.md"
      role: "onboarding and time-to-value candidate"
    - path: "Consultry-Priority-Problem-Evidence-and-Assumption-Register-v0.1.md"
      role: "priority-problem evidence baseline"
    - path: "Consultry-Project-Intelligence-Symbiosis-Graph-v1.0.md"
      role: "project intelligence, symbiosis and productization candidate"
    - path: "Consultry-UX-Operating-Model-v0.1.md"
      role: "object- and work-centered interaction candidate"
    - path: "Consultry-Dynamic-CoWork-Surface-Moment-Map-v0.1.md"
      role: "prototype mapping of dynamic visual, question, few-shot and outcome-test surfaces to recurring co-work moments and anchor journeys"
      caveat: "ratified as Click-Dummy selection and validation hypothesis; not a fixed screen sequence or canonical Design-System component set"
    - path: "Consultry-Whiteboard-Derived-Mermaid-Diagrams-v0.1.md"
      role: "visual source and relationship input"
    - path: "Consultry-AI-Native-CMS-Module-v1.0.md"
      role: "future module candidate"

  evidence_and_research:
    - path: "research/"
      role: "research, counterevidence, source register and deep-grill bank"
      caveat: "evidence informs but does not ratify Product Decisions"
    - path: "ux-blueprint/"
      role: "visual UX evidence set"
      caveat: "screen evidence is not usability validation"

  technical_handoff_not_product_canon:
    - path: "handoffs/Consultry-Systemic-Platform-Click-Dummy-Scope-and-WBS-Delta-v0.2.md"
      role: "current scope and WBS delta for the systemic frontend-only Click Dummy"
      caveat: "supersedes the v0.1 handover only for scope, route/state model, WBS, Definition of Done and validation focus"
    - path: "handoffs/Consultry-Three-Slice-Mock-UI-Implementation-Handover-v0.1.md"
      role: "partially superseded Next.js implementation handover whose foundation, worktree and quality rules remain applicable"
    - path: "Consultry-MVP-Foundation-Decisions-v1.0.md"
    - path: "Consultry-MVP-Technical-Foundation-v1.0.md"
    - path: "Consultry-MVP-Architecture-ADR-v1.0.md"
    - path: "Consultry-MVP-AWS-Hermes-Architecture-v1.0.md"
    - path: "Consultry-MVP-Backend-IaC-Software-Design-v1.0.md"
    - path: "Consultry-MVP-Virtual-Harness-Second-Brain-Refinement-v1.0.md"
    - path: "Consultry-Platform-Kernel-Data-Model-Concept-v0.1.md"
    - path: "Consultry-Privacy-Egress-Gateway-v0.1.md"

archive_root: "../archive"
