<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultry MVP Ad - Animation Clipframes</title>
<style>
  :root {
    --brand: #BF5347;
    --warm: #E8913A;
    --purple: #9B59B6;
    --teal: #78B7C5;
    --ink: #1C1B19;
    --paper: #F6F3EF;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #171512;
    color: #EFEAE3;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    width: min(100vw, 1280px);
    padding: 18px;
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 12px;
    background: #F6F3EF;
    box-shadow: 0 24px 80px rgba(0,0,0,.36);
  }

  #frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }

  button {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 800;
    color: white;
    background: linear-gradient(120deg, var(--warm), var(--brand) 58%, var(--purple));
    cursor: pointer;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--brand);
  }

  .time {
    width: 86px;
    color: #CFC7BE;
    font-size: 14px;
    font-weight: 700;
    text-align: right;
  }
</style>
</head>
<body>
<main>
  <div class="stage">
    <div id="frame"></div>
  </div>
  <div class="controls">
    <button id="play">Pause</button>
    <input id="scrub" type="range" min="0" max="15000" step="16" value="0" aria-label="Timeline">
    <div id="time" class="time">0.0s</div>
  </div>
</main>

<script>
const WIDTH = 1280;
const HEIGHT = 720;
const DURATION_MS = 15000;

const CLIPFRAMES = [
  { start: 0, end: 2000, tag: "Pain", headline: ["Consultants carry", "too much in their heads."], sub: "Calls, context and deadlines collide.", visual: "scatter" },
  { start: 2000, end: 4000, tag: "Pain", headline: ["Work feels scattered.", "Decisions feel late."], sub: "Tools and skills do not line up.", visual: "search" },
  { start: 4000, end: 6100, tag: "New way to work", headline: ["AI work needs", "better structure."], sub: "Knowledge, planning, delivery. One layer.", visual: "graph" },
  { start: 6100, end: 8100, tag: "Consultant confidence", headline: ["Every call starts", "with clear context."], sub: "Goals, risks, next steps. One view.", visual: "workday" },
  { start: 8100, end: 10100, tag: "Integrations", headline: ["Your tools become", "project intelligence."], sub: "M365, Jira, Git, Drive, SQL, NoSQL, Clay and Apollo.", visual: "signals" },
  { start: 10100, end: 12300, tag: "Smart alignment", headline: ["Spot blind spots", "before the call."], sub: "Evidence, skills and assumptions checked together.", visual: "pipeline" },
  { start: 12300, end: 15000, tag: "Consultry MVP", headline: ["Less stress.", "More confidence."], sub: "Opportunity-to-Concept in 5 business days.", visual: "finale" }
];

function clamp(n, min = 0, max = 1) { return Math.max(min, Math.min(max, n)); }
function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function out(t) { return 1 - Math.pow(1 - t, 3); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&apos;" }[ch]));
}
function activeScene(ms) {
  return CLIPFRAMES.find(frame => ms >= frame.start && ms < frame.end) || CLIPFRAMES[CLIPFRAMES.length - 1];
}
function sceneProgress(scene, ms) {
  return clamp((ms - scene.start) / (scene.end - scene.start));
}
function lines(items, x, y, size, weight, fill, lineHeight, anchor = "start", opacity = 1) {
  return `<text x="${x}" y="${y}" fill="${fill}" opacity="${opacity}" font-family="Inter, Arial, sans-serif" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}">${items.map((line, i) => `<tspan x="${x}" dy="${i === 0 ? 0 : lineHeight}">${esc(line)}</tspan>`).join("")}</text>`;
}
function rect(x, y, w, h, r, fill, stroke = "none", opacity = 1) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" opacity="${opacity}"/>`;
}
function circle(x, y, r, fill, opacity = 1) {
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" opacity="${opacity}"/>`;
}
function pill(x, y, label, fill, color = "#fff") {
  return `<g>${rect(x, y, label.length * 9 + 42, 42, 21, fill)}${lines([label], x + 21, y + 27, 17, 850, color, 20)}</g>`;
}
function logo(x, y, size, p = 1) {
  const r = size * .24;
  const inner = size * .52 + Math.sin(p * Math.PI * 2) * size * .025;
  return `<g transform="translate(${x} ${y})">
    ${rect(0, 0, size, size, r, "url(#brandGrad)")}
    <path d="M${size*.30} ${size*.28} L${size*.72} ${size*.28} L${size*.47} ${size*.50} L${size*.73} ${size*.72} L${size*.31} ${size*.72} L${size*.56} ${size*.50} Z" fill="#fff" opacity=".95"/>
    ${circle(size*.50, size*.50, inner*.10, "#fff", .26)}
  </g>`;
}
function sourceCard(x, y, label, accent, p, delay = 0) {
  const q = clamp((p - delay) / .42);
  const ty = 28 * (1 - out(q));
  const op = clamp(q * 1.4);
  return `<g transform="translate(${x} ${y + ty})" opacity="${op}">
    ${rect(0, 0, 188, 74, 12, "#fff", "#E4DED7")}
    ${circle(27, 37, 12, accent)}
    ${lines([label], 52, 33, 20, 850, "#2A2724", 24)}
    ${rect(52, 45, 96, 7, 4, "#E8E2DB")}
  </g>`;
}
function visualScatter(p) {
  const left = 692;
  return `<g>
    ${sourceCard(left + 18, 112, "M365", "#78B7C5", p, 0)}
    ${sourceCard(left + 284, 164, "Jira", "#9B59B6", p, .08)}
    ${sourceCard(left + 94, 288, "Git", "#BF5347", p, .16)}
    ${sourceCard(left + 356, 344, "Drive", "#E8913A", p, .24)}
    ${sourceCard(left + 210, 488, "SQL", "#16A34A", p, .32)}
    <path d="M790 185 C850 230 890 250 956 200 M846 344 C900 330 966 380 1034 370 M908 526 C955 474 1028 458 1104 418" fill="none" stroke="#DAD2CA" stroke-width="4" stroke-dasharray="8 12" opacity="${.35 + .25 * p}"/>
  </g>`;
}
function visualSearch(p) {
  const q = ease(p);
  const x = 728;
  return `<g transform="translate(${x} 132)">
    ${rect(0, 0, 430, 430, 22, "#fff", "#E3DDD6")}
    ${rect(34, 40, 330, 48, 24, "#F5F1EC", "#E3DDD6")}
    ${circle(65, 64, 13, "none", 1).replace('fill="none"', 'fill="none" stroke="#BF5347" stroke-width="5"')}
    <line x1="75" y1="75" x2="91" y2="91" stroke="#BF5347" stroke-width="5" stroke-linecap="round"/>
    ${["alte Referenz", "CV suchen", "Risiken pruefen", "Kalkulation", "Proof"].map((label, i) => {
      const rowP = clamp((p - i * .08) / .44);
      return `<g opacity="${clamp(rowP * 1.2)}" transform="translate(${36} ${126 + i * 54})">
        ${rect(0, 0, 342, 34, 8, i === 2 ? "#FFF6EC" : "#F7F4F0", "none")}
        ${rect(14, 12, 190 + i * 17, 10, 5, i === 2 ? "#E8913A" : "#D7D0C8")}
        <text x="238" y="23" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#7B7671">${esc(label)}</text>
      </g>`;
    }).join("")}
    <g transform="translate(${276 + 18 * Math.sin(q * 5)} ${278 - 20 * q})" opacity="${.92}">
      ${circle(0, 0, 50, "#BF5347", .12)}
      ${circle(0, 0, 34, "#BF5347", .20)}
      ${lines(["?"], 0, 16, 58, 900, "#BF5347", 60, "middle")}
    </g>
  </g>`;
}
function visualGraph(p) {
  const cx = 936;
  const cy = 354;
  const nodes = [
    [-190, -160, "Corpus", "#78B7C5"],
    [190, -142, "Projekte", "#9B59B6"],
    [-210, 128, "Skills", "#E8913A"],
    [205, 126, "Belege", "#16A34A"],
    [0, 0, "Second Brain", "#BF5347"]
  ];
  return `<g>
    ${nodes.slice(0, 4).map(([dx, dy, label, color], i) => {
      const q = out(clamp((p - i * .07) / .6));
      const x = cx + dx * (1 - .18 * q);
      const y = cy + dy * (1 - .18 * q);
      return `<path d="M${x} ${y} C${(x + cx)/2} ${(y + cy)/2 - 40} ${cx} ${cy} ${cx} ${cy}" fill="none" stroke="${color}" stroke-width="4" opacity="${.22 + .42 * q}"/>`;
    }).join("")}
    ${nodes.map(([dx, dy, label, color], i) => {
      const q = out(clamp((p - i * .07) / .6));
      const size = label === "Second Brain" ? 164 : 122;
      const x = cx + dx * (1 - .18 * q) - size / 2;
      const y = cy + dy * (1 - .18 * q) - 44;
      return `<g opacity="${q}">
        ${rect(x, y, size, 88, 18, label === "Second Brain" ? "url(#brandGrad)" : "#fff", label === "Second Brain" ? "none" : "#E3DDD6")}
        ${lines([label], x + size / 2, y + 54, label === "Second Brain" ? 21 : 19, 900, label === "Second Brain" ? "#fff" : "#2A2724", 22, "middle")}
      </g>`;
    }).join("")}
  </g>`;
}
function visualSandbox(p) {
  const q = ease(p);
  return `<g transform="translate(705 116)">
    ${rect(0, 0, 468, 452, 24, "#fff", "#E3DDD6")}
    ${rect(0, 0, 468, 58, 24, "#2A2724")}
    ${circle(30, 29, 7, "#BF5347")}${circle(52, 29, 7, "#E8913A")}${circle(74, 29, 7, "#78B7C5")}
    ${lines(["Hermes Harness"], 106, 37, 17, 850, "#F6F3EF", 20)}
    <g transform="translate(44 98)">
      ${rect(0, 0, 156, 230, 18, "#FFF8F4", "#EFD6C8")}
      ${lines(["Harness", "Pack"], 78, 70, 28, 900, "#BF5347", 32, "middle")}
      ${rect(32, 118, 92, 10, 5, "#E8913A")}${rect(32, 142, 72, 10, 5, "#CFC7BE")}
    </g>
    <g transform="translate(${250 + 18 * (1 - q)} 104)" opacity="${q}">
      ${rect(0, 0, 164, 220, 18, "#F6F3EF", "#E3DDD6")}
      ${lines(["Konzept", "Draft"], 82, 66, 27, 900, "#2A2724", 32, "middle")}
      ${rect(34, 112, 96, 10, 5, "#BF5347")}${rect(34, 138, 116, 10, 5, "#78B7C5")}${rect(34, 164, 80, 10, 5, "#9B59B6")}
    </g>
    <path d="M214 212 C240 212 242 212 268 212" fill="none" stroke="#E8913A" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 12" opacity="${.4 + .5 * q}"/>
    ${pill(58, 362, "policy-gated", "#2A2724")}
    ${pill(244, 362, "source-bound", "#BF5347")}
  </g>`;
}
function visualWorkday(p) {
  const q = ease(p);
  const checklist = [
    ["Client goal", "#78B7C5"],
    ["Known risks", "#BF5347"],
    ["Open questions", "#E8913A"],
    ["Next best plan", "#16A34A"]
  ];
  return `<g transform="translate(694 104)">
    ${rect(0, 0, 474, 474, 24, "#fff", "#E3DDD6")}
    ${rect(0, 0, 474, 66, 24, "#2A2724")}
    ${lines(["Call Prep Overview"], 34, 42, 22, 900, "#F6F3EF", 26)}
    <g transform="translate(34 102)">
      ${circle(52, 52, 52, "#F6F3EF")}
      ${circle(52, 52, 34, "#78B7C5", .22)}
      ${lines(["9:30"], 52, 49, 23, 900, "#2A2724", 26, "middle")}
      ${lines(["client call"], 52, 74, 13, 800, "#605D59", 16, "middle")}
    </g>
    <g transform="translate(160 98)">
      ${lines(["What matters now"], 0, 24, 21, 900, "#2A2724", 26)}
      ${lines(["No tab chaos. No last-minute guessing."], 0, 54, 16, 720, "#605D59", 20)}
      ${checklist.map(([label, color], i) => {
        const itemP = out(clamp((p - i * .09) / .45));
        return `<g opacity="${itemP}" transform="translate(0 ${92 + i * 58})">
          ${circle(15, 15, 15, color)}
          <path d="M8 15 L13 20 L23 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          ${lines([label], 42, 22, 19, 850, "#2A2724", 22)}
          ${rect(226, 7, 72 + i * 19, 12, 6, color, "none", .28 + .26 * itemP)}
        </g>`;
      }).join("")}
    </g>
    <g transform="translate(38 388)" opacity="${out(clamp((p - .48) / .4))}">
      ${rect(0, 0, 398, 48, 24, "url(#brandGrad)")}
      ${lines(["clear plan, calmer day"], 199, 31, 18, 900, "#fff", 22, "middle")}
    </g>
    <g transform="translate(${366 + 12 * Math.sin(q * 4)} ${96 + 10 * Math.cos(q * 4)})" opacity=".9">
      ${circle(0, 0, 34, "#E8913A", .18)}
      ${lines(["AI"], 0, 10, 21, 930, "#BF5347", 22, "middle")}
    </g>
  </g>`;
}
function visualSignals(p) {
  const items = [
    ["Jira", 716, 120, "#9B59B6"],
    ["M365", 1028, 120, "#78B7C5"],
    ["Git", 700, 422, "#BF5347"],
    ["Drive", 1044, 422, "#E8913A"],
    ["DB", 872, 510, "#16A34A"]
  ];
  return `<g>
    ${items.map(([label, x, y, color], i) => {
      const q = out(clamp((p - i * .04) / .5));
      return `<g opacity="${q}">
        ${rect(x, y, 150, 58, 14, "#fff", "#E3DDD6")}
        ${circle(x + 31, y + 29, 11, color)}
        ${lines([label], x + 54, y + 36, 19, 850, "#2A2724", 22)}
        <path d="M${x + 75} ${y + 58} C${900} ${280} ${930} ${330} 936 360" fill="none" stroke="${color}" stroke-width="3" opacity=".42"/>
      </g>`;
    }).join("")}
    <g transform="translate(832 238)">
      ${rect(0, 0, 250, 150, 22, "url(#brandGrad)")}
      ${lines(["Project", "Signal"], 125, 66, 34, 900, "#fff", 38, "middle")}
      ${lines(["Requirement + Skill + Beleg"], 125, 120, 17, 800, "rgba(255,255,255,.82)", 20, "middle")}
    </g>
  </g>`;
}
function visualPipeline(p) {
  const steps = ["Signal", "Requirement", "Skill Shape", "Risiko", "Konzept"];
  return `<g transform="translate(692 190)">
    ${steps.map((step, i) => {
      const q = out(clamp((p - i * .08) / .5));
      const x = i * 96;
      return `<g opacity="${q}" transform="translate(${x} ${Math.sin((p + i) * 4) * 4})">
        ${circle(44, 72, 40, i === 4 ? "#BF5347" : "#fff", 1)}
        <circle cx="44" cy="72" r="40" fill="none" stroke="${i === 4 ? "#BF5347" : "#D9D2CB"}" stroke-width="3"/>
        ${lines([String(i + 1)], 44, 84, 28, 900, i === 4 ? "#fff" : "#BF5347", 30, "middle")}
        ${lines([step], 44, 144, 18, 850, "#2A2724", 22, "middle")}
        ${i < steps.length - 1 ? `<path d="M88 72 H122" stroke="#E8913A" stroke-width="5" stroke-linecap="round" opacity="${q}"/>` : ""}
      </g>`;
    }).join("")}
    ${rect(28, 250, 470, 92, 18, "#fff", "#E3DDD6")}
    ${lines(["Belege, Risiken und naechste Schritte", "in einem pruefbaren Entwurf."], 263, 288, 24, 850, "#2A2724", 31, "middle", out(clamp((p - .48) / .38)))}
  </g>`;
}
function visualFinale(p) {
  const q = ease(p);
  return `<g>
    <g transform="translate(808 150) scale(${.92 + .08 * q})">
      ${logo(0, 0, 260, p)}
    </g>
    ${rect(714, 470, 460, 70, 35, "#fff", "none", .92)}
    ${lines(["Source-bound Concept Suite"], 944, 514, 24, 900, "#BF5347", 28, "middle")}
  </g>`;
}
function renderVisual(type, p) {
  if (type === "scatter") return visualScatter(p);
  if (type === "search") return visualSearch(p);
  if (type === "graph") return visualGraph(p);
  if (type === "sandbox") return visualSandbox(p);
  if (type === "workday") return visualWorkday(p);
  if (type === "signals") return visualSignals(p);
  if (type === "pipeline") return visualPipeline(p);
  return visualFinale(p);
}
function renderSvg(ms) {
  const scene = activeScene(ms);
  const p = sceneProgress(scene, ms);
  const fadeIn = clamp(p / .16);
  const fadeOut = clamp((1 - p) / .16);
  const opacity = Math.min(1, fadeIn, fadeOut);
  const slide = 22 * (1 - out(clamp(p / .38)));
  const total = clamp(ms / DURATION_MS);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${WIDTH} ${HEIGHT}" width="${WIDTH}" height="${HEIGHT}">
    <defs>
      <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E8913A"/><stop offset=".56" stop-color="#BF5347"/><stop offset="1" stop-color="#9B59B6"/>
      </linearGradient>
      <radialGradient id="soft" cx="78%" cy="16%" r="75%">
        <stop offset="0" stop-color="#FFF6EC"/><stop offset=".48" stop-color="#F6F3EF"/><stop offset="1" stop-color="#ECE7E1"/>
      </radialGradient>
    </defs>
    <rect width="${WIDTH}" height="${HEIGHT}" fill="url(#soft)"/>
    <circle cx="${1070 + Math.sin(total * 6) * 22}" cy="${96 + Math.cos(total * 4) * 18}" r="230" fill="#E8913A" opacity=".08"/>
    <circle cx="${1130 - Math.sin(total * 5) * 16}" cy="620" r="210" fill="#78B7C5" opacity=".10"/>
    <path d="M0 638 C190 590 310 668 480 622 C650 576 770 604 900 660 C1040 724 1160 674 1280 620 V720 H0 Z" fill="#1C1B19" opacity=".045"/>
    <g opacity="${opacity}" transform="translate(0 ${slide})">
      ${logo(70, 58, 58, total)}
      ${pill(152, 66, scene.tag, scene.visual === "finale" ? "#2A2724" : "#BF5347")}
      ${lines(scene.headline, 72, 214, scene.visual === "finale" ? 66 : 68, 930, "#1C1B19", 73)}
      ${lines([scene.sub], 76, 418, 33, 720, "#605D59", 40)}
      ${renderVisual(scene.visual, p)}
    </g>
    <g transform="translate(70 654)">
      <rect width="1140" height="8" rx="4" fill="#DED8D0"/>
      <rect width="${1140 * total}" height="8" rx="4" fill="url(#brandGrad)"/>
    </g>
  </svg>`;
}

let playing = true;
let started = performance.now();
let pausedAt = 0;
const frame = document.getElementById("frame");
const scrub = document.getElementById("scrub");
const play = document.getElementById("play");
const time = document.getElementById("time");

function draw(ms) {
  frame.innerHTML = renderSvg(ms);
  scrub.value = String(ms);
  time.textContent = `${(ms / 1000).toFixed(1)}s`;
}
function tick(now) {
  if (playing) {
    const ms = (now - started) % DURATION_MS;
    draw(ms);
  }
  requestAnimationFrame(tick);
}
play.addEventListener("click", () => {
  playing = !playing;
  play.textContent = playing ? "Pause" : "Play";
  if (playing) started = performance.now() - pausedAt;
});
scrub.addEventListener("input", () => {
  pausedAt = Number(scrub.value);
  started = performance.now() - pausedAt;
  draw(pausedAt);
});
window.renderAt = draw;
window.CLIPFRAMES = CLIPFRAMES;
draw(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
